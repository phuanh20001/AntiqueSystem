<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — AntiqChain</title>
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/dashboard.css">
</head>
<body>

  <nav>
    <a class="nav-logo" href="../index.html">AntiqChain <span>— Verified Heritage</span></a>
    <div class="nav-links">
      <a href="../index.html">Home</a>
      <a href="products.html">Products</a>
      <a href="about.html">About</a>
      <a href="submit.html">Submit Item</a>
      <a href="dashboard.html" class="active">Dashboard</a>
      <a href="login.html" class="nav-cta">Sign In</a>
    </div>
  </nav>

  <div class="welcome-banner" id="welcome-banner" style="display:none;">
    <div class="welcome-banner-title" id="welcome-banner-title"></div>
  </div>

  <div class="dashboard-layout" id="dashboard-root">
    <div style="padding: 40px;">Loading dashboard data...</div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="../js/utils.js"></script>
  <script src="../js/api.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    const session = requireDashboardSession();
    let dashboardRefreshTimer = null;
    let dashboardCurrentRole = null;
    let dashboardItemView = 'all';
    let dashboardAdminView = 'analytics';
    let dashboardPurchaseHistory = [];

    function escapeHtml(value) {
      return String(value || '').replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#39;');
    }
    function normalizeRole(role) {
      const raw = String(role || '').toLowerCase().trim();
      if (raw === 'user' || raw === 'collector') return 'collector';
      if (raw === 'verifier') return 'verifier';
      if (raw === 'admin') return 'admin';
      return 'collector';
    }
    function normalizeItems(r) { if (Array.isArray(r)) return r; if (Array.isArray(r?.items)) return r.items; if (Array.isArray(r?.data)) return r.data; return []; }
    function normalizeUsers(r) { if (Array.isArray(r)) return r; if (Array.isArray(r?.users)) return r.users; if (Array.isArray(r?.data)) return r.data; return []; }
    function countByStatus(items, statuses) { return items.filter((i) => statuses.includes(String(i.verificationStatus || i.status || '').toLowerCase())).length; }
    function getStatusBadge(status) {
      const safe = status || 'Pending';
      const low = safe.toLowerCase();
      let cls = 'badge-pending';
      if (low.includes('verified') || low.includes('approved')) cls = 'badge-verified';
      if (low.includes('rejected')) cls = 'badge-rejected';
      return `<span class="badge ${cls}">${escapeHtml(safe)}</span>`;
    }
    function getHealthBadge(health) {
      if (!health) return '<span class="backend-health-pill backend-health-unknown">Checking backend...</span>';
      if (health.status === 'ok') return `<span class="backend-health-pill backend-health-ok">Live · ${escapeHtml(health.mongo)} · ${escapeHtml(health.blockchain)}</span>`;
      return `<span class="backend-health-pill backend-health-degraded">Degraded · ${escapeHtml(health.mongo)} · ${escapeHtml(health.blockchain)}</span>`;
    }
    function showWelcomeBanner(user) {
      const banner = document.getElementById('welcome-banner');
      const title = document.getElementById('welcome-banner-title');
      title.textContent = 'Welcome, ' + (user.displayName || user.name || user.firstName || user.email || 'user');
      banner.style.display = 'block';
      requestAnimationFrame(() => banner.classList.add('show'));
      setTimeout(() => { banner.classList.remove('show'); setTimeout(() => banner.style.display = 'none', 350); }, 4200);
    }
function stopDashboardAutoRefresh() {
  if (dashboardRefreshTimer) {
    clearInterval(dashboardRefreshTimer);
    dashboardRefreshTimer = null;
  }
}
    function renderLoading() {
      const root = document.getElementById('dashboard-root');

      root.innerHTML = `
        <div class="dashboard-main" style="width:100%; padding:40px;">
          <div class="dashboard-panel">
            <div class="panel-body" style="text-align: center; padding: 60px 20px;">
              <div style="font-size: 24px; margin-bottom: 16px;">⏳</div>
              <p style="color: var(--ink-light); font-weight: 500;">Loading dashboard data...</p>
            </div>
          </div>
        </div>
      `;
    }

    function renderError(message) {
      const root = document.getElementById('dashboard-root');

      root.innerHTML = `
        <div class="dashboard-main" style="width:100%; padding:40px;">
          <div class="dashboard-panel">
            <div class="panel-head">
              <div>
                <h3>Unable to load dashboard</h3>
                <p>${escapeHtml(message || 'Please try again later.')}</p>
              </div>
            </div>
            <div class="panel-body">
              <button class="btn-sm btn-review" onclick="loadDashboardData()">Retry</button>
            </div>
          </div>
        </div>
      `;
    }

    function renderSidebar(user, items) {
      const name =
        user.displayName ||
        user.name ||
        `${user.firstName || ''} ${user.lastName || ''}`.trim() ||
        'AntiqChain User';

      const role = user.role || 'collector';

      const totalItems = items.length;
      const pendingItems = items.filter(item =>
        String(item.verificationStatus || item.status || '').toLowerCase().includes('pending') ||
        String(item.verificationStatus || item.status || '').toLowerCase().includes('review')
      ).length;

      const verifiedItems = items.filter(item =>
        String(item.verificationStatus || item.status || '').toLowerCase().includes('verified') ||
        String(item.verificationStatus || item.status || '').toLowerCase().includes('approved')
      ).length;
      const rejectedItems = items.filter(item =>
  String(item.verificationStatus || item.status || '').toLowerCase().includes('rejected')
).length;

      return `
        <div class="dashboard-sidebar">
          <div class="sidebar-profile">
            <div class="sidebar-name">${escapeHtml(name)}</div>
            <div class="sidebar-role">${escapeHtml(role)} account</div>
          </div>

          <div class="sidebar-section-label">
  ${
    role === 'admin'
      ? 'Administration'
      : role === 'verifier'
      ? 'Verification'
      : 'Collection'
  }
</div>
          <div class="sidebar-section">
            <a class="sidebar-item active" href="#">
              <span>📦</span>
${
  role === 'admin'
    ? 'All Items'
    : role === 'verifier'
    ? 'Review Queue'
    : 'My Submissions'
}
              <span class="sidebar-count">${totalItems}</span>
            </a>
            <a class="sidebar-item" href="#">
              <span>🟡</span> In Review
              <span class="sidebar-count rust">${pendingItems}</span>
            </a>
            <a class="sidebar-item" href="#">
              <span>📜</span> Verified
              <span class="sidebar-count green">${verifiedItems}</span>
            </a>
            <a class="sidebar-item" href="#">
           <span>❌</span> Rejected
           <span class="sidebar-count rust">${rejectedItems}</span>
          </a>

          </div>

          <div class="sidebar-section-label">Actions</div>
          <div class="sidebar-section">
            <a class="sidebar-item" href="submit.html">
              <span>➕</span> Submit New Item
            </a>
            <a class="sidebar-item" href="../index.html">
              <span>🏠</span> Back to Home
            </a>
          </div>
        </div>
      `;
    }

    function renderStats(items) {
      const total = items.length;

      const pending = items.filter(item =>
        String(item.verificationStatus || item.status || '').toLowerCase().includes('pending') ||
        String(item.verificationStatus || item.status || '').toLowerCase().includes('review')
      ).length;

      const verified = items.filter(item =>
        String(item.verificationStatus || item.status || '').toLowerCase().includes('verified') ||
        String(item.verificationStatus || item.status || '').toLowerCase().includes('approved')
      ).length;

      const blockchainLinked = items.filter(item =>
        item.blockchainHash || item.blockchainTransactionHash
      ).length;

      return `
        <div class="dash-stats">
          <div class="dash-stat">
            <div class="dash-stat-num gold">${total}</div>
            <div class="dash-stat-label">My Submissions</div>
          </div>
          <div class="dash-stat">
            <div class="dash-stat-num rust">${pending}</div>
            <div class="dash-stat-label">In Review</div>
          </div>
          <div class="dash-stat">
            <div class="dash-stat-num green">${verified}</div>
            <div class="dash-stat-label">Verified</div>
          </div>
          <div class="dash-stat">
            <div class="dash-stat-num">${blockchainLinked}</div>
            <div class="dash-stat-label">Blockchain Proofs</div>
          </div>
        </div>
      `;
    }

    function renderPurchaseHistoryRows(items) {
      if (!items.length) {
        return `<tr><td colspan="5" style="text-align:center; padding:24px; color:var(--ink-light);">No purchase history yet.</td></tr>`;
      }

      return items.map((item) => `
        <tr>
          <td>${escapeHtml(item.title || 'Untitled Item')}</td>
          <td>${escapeHtml(item.category || 'N/A')}</td>
          <td>${escapeHtml(item.purchasedAt ? new Date(item.purchasedAt).toLocaleString() : 'N/A')}</td>
          <td>${item.purchaseAmount ? '$' + escapeHtml(item.purchaseAmount) : 'N/A'}</td>
          <td><button class="btn-sm btn-review" onclick="window.location.href='detail.html?id=${item._id}'">View</button></td>
        </tr>
      `).join('');
      }
async function changeItemStatus(itemId, verificationStatus) {
  try {
    await apiRequest(`/items/${itemId}/verification-status`, 'PUT', { verificationStatus }, true);
    showToast(`Item ${verificationStatus === 'verified' ? 'approved' : 'rejected'} successfully.`);
    loadDashboardData();
  } catch (error) {
    showToast(error.message || 'Unable to update item status.', true);
  }
}
      function renderItemRows(items, role) {
  if (!items.length) {
    return `
      <tr>
        <td colspan="6" style="text-align:center; padding:30px; color:var(--ink-light);">
          No submitted items found.
        </td>
      </tr>
    `;
  }

  return items.map((item) => {
    const status = item.verificationStatus || item.status || 'Pending';
    const statusLower = String(status).toLowerCase();

    let actionButtons = `
      <button class="btn-sm btn-review" onclick="window.location.href='detail.html?id=${item._id}'">
        View
      </button>
    `;

    if (role === 'verifier' && (statusLower === 'pending' || statusLower === 'in_progress')) {
      actionButtons = `
        <div class="table-actions">
          <button class="btn-sm btn-approve" onclick="changeItemStatus('${item._id}', 'verified')">
            Approve
          </button>
          <button class="btn-sm btn-decline" onclick="changeItemStatus('${item._id}', 'rejected')">
            Reject
          </button>
          <button class="btn-sm btn-review" onclick="window.location.href='detail.html?id=${item._id}'">
            View
          </button>
        </div>
      `;
    }

    return `
      <tr>
        <td>🏺</td>
        <td>
          <div class="item-row-title">${escapeHtml(item.title || 'Untitled Item')}</div>
          <div class="item-row-sub">${escapeHtml(item.category || 'Antique Item')}</div>
        </td>
        <td>${getStatusBadge(status)}</td>
        <td style="font-size:13px;color:var(--ink-light);">
          ${escapeHtml(item.blockchainHash || 'Pending')}
        </td>
        <td style="font-size:13px;color:var(--ink-light);">
          ${escapeHtml(item.blockchainTransactionHash || 'Pending')}
        </td>
        <td>${actionButtons}</td>
      </tr>
    `;
  }).join('');
}
async function deleteAdminUser(userId) {
  if (!confirm('Delete this account permanently?')) return;

  try {
    await apiRequest(`/auth/users/${userId}`, 'DELETE', null, true);

    showToast('Account deleted successfully.');

    loadAdminUsers();

  } catch (error) {
    showToast(error.message || 'Unable to delete account.', true);
  }
}
async function loadAdminUsers() {
  const panel = document.getElementById('admin-users-panel');

  try {
    panel.innerHTML = `<p>Loading accounts...</p>`;

    const usersResponse = await apiRequest('/auth/users', 'GET', null, true);
    console.log('ADMIN USERS RESPONSE:', usersResponse);

    const users =
      Array.isArray(usersResponse)
        ? usersResponse
        : Array.isArray(usersResponse?.users)
        ? usersResponse.users
        : Array.isArray(usersResponse?.data)
        ? usersResponse.data
        : [];

    if (!users.length) {
      panel.innerHTML = `<p style="padding:12px;">No accounts found.</p>`;
      return;
    }

    panel.innerHTML = `
      <table class="review-table">
        <thead>
          <tr>
            <th>Username</th>
            <th>Email</th>
            <th>Role</th>
            <th>Status</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody>
          ${users.map(account => `
            <tr>
              <td>${escapeHtml(account.username || account.name || 'Unknown')}</td>
              <td>${escapeHtml(account.email || 'N/A')}</td>
              <td>${escapeHtml(account.role || account.requestedRole || 'collector')}</td>
              <td>${getStatusBadge(account.status || 'approved')}</td>
              <td>
                <button class="btn-sm btn-review" onclick="window.location.href='account-detail.html?id=${account._id}'">
                  View
                </button>
                ${account.role !== 'admin' ? `
                  <button class="btn-sm btn-decline" onclick="deleteAdminUser('${account._id}')">
                    Delete
                  </button>
                ` : ''}

            </tr>
          `).join('')}
        </tbody>
      </table>
    `;
  } catch (error) {
    console.error('loadAdminUsers error:', error);
    panel.innerHTML = `<p style="padding:12px;color:#b00020;">Unable to load accounts.</p>`;
  }
}
    function renderDashboard(user, items, health) {
      const root = document.getElementById('dashboard-root');

      const name =
        user.displayName ||
        user.name ||
        user.firstName ||
        user.email ||
        'User';

      root.innerHTML = `
        ${renderSidebar(user, items)}

        <div class="dashboard-main">
          <div class="dash-topbar">
            <div>
              <h2>
  ${
    user.role === 'admin'
      ? 'Admin Dashboard'
      : user.role === 'verifier'
      ? 'Verifier Dashboard'
      : 'Collection Dashboard'
  }
</h2>
              <p>Track submitted antiques, verification progress, and blockchain proof references.</p>
            </div>
            <div class="dash-topbar-actions">
              ${getHealthBadge(health)}
              ${
  user.role === 'collector'
    ? `
      <a class="btn-primary" style="font-size:13px;padding:10px 20px;" href="submit.html">
        Submit New Item
      </a>
    `
    : ''
}
            </div>
          </div>

          ${renderStats(items)}

          <div class="dash-content dashboard-grid dashboard-grid-single">
            <section class="dashboard-panel dashboard-panel-wide">
              <div class="panel-head">
                <div>
                  <h3>
  ${
    user.role === 'admin'
      ? 'System Items'
      : user.role === 'verifier'
      ? 'Verification Queue'
      : 'My Submitted Items'
  }
</h3>
                  <p>These records are loaded from the backend API when available.</p>
                </div>
                <button class="btn-sm btn-review" onclick="loadDashboardData()">Refresh</button>
              </div>

              <div class="panel-body">
                <table class="review-table">
                  <thead>
                    <tr>
                      <th></th>
                      <th>Item</th>
                      <th>Status</th>
                      <th>Certificate Hash</th>
                      <th>Transaction Hash</th>
                      <th>Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    ${renderItemRows(items,user.role)}
                  </tbody>
                </table>
              </div>
            </section>
          </div>
          ${user.role === 'admin' ? `
  <section class="dashboard-panel dashboard-panel-wide" style="margin-top:18px;">
    <div class="panel-head">
      <div>
        <h3>Account Management</h3>
        <p>Manage user, verifier, and admin accounts.</p>
      </div>
    </div>

    <div class="panel-body">
      <button class="btn-sm btn-review" onclick="loadAdminUsers()">Load Accounts</button>
      <div id="admin-users-panel" style="margin-top:16px;"></div>
    </div>
  </section>
` : ''}
        </div>
      `;

      showWelcomeBanner(user);
    }

    function normalizeItems(response) {
      if (Array.isArray(response)) return response;
      if (Array.isArray(response.items)) return response.items;
      if (Array.isArray(response.data)) return response.data;
      return [];
    }

    async function loadDashboardData() {
  if (!session) return;
  renderLoading();

  try {
    const userResponse = await apiRequest('/auth/me', 'GET', null, true);
    const user = userResponse.user || userResponse.data || userResponse || session;

    user.role = normalizeRole(user.role || user.requestedRole);

    const userNameCheck = String(user.username || user.email || '').toLowerCase();
    if (userNameCheck.includes('verifier')) user.role = 'verifier';
    if (userNameCheck.includes('admin')) user.role = 'admin';

    const itemsResponse = await apiRequest('/items', 'GET', null, true);
    const healthResponse = await getBackendHealth();

    const items = normalizeItems(itemsResponse);

    console.log('loadDashboardData: rendering dashboard with', items.length, 'items');
    renderDashboard(user, items, healthResponse || null);

  } catch (error) {
    console.error('loadDashboardData error:', error);

    if (
      error.message &&
      (error.message.toLowerCase().includes('unauthorized') ||
       error.message.toLowerCase().includes('token'))
    ) {
      if (typeof signOutAndRedirect === 'function') {
        signOutAndRedirect();
        return;
      }
    }

    renderError(error.message || 'Unable to load dashboard data.');

    if (typeof showToast === 'function') {
      showToast(error.message || 'Unable to load dashboard data.', true);
    }
  }
}


    document.addEventListener('DOMContentLoaded', () => { if (session) loadDashboardData(); });
    document.addEventListener('visibilitychange', () => {});
    window.addEventListener('beforeunload', stopDashboardAutoRefresh);
  </script>

</body>
</html>
